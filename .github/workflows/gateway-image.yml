# The OpenCode gateway's Docker image, ghcr.io/<owner>/maviechat-gateway (amd64 and arm64):
# "latest" from main, a version from gateway-v* tags, and a sha tag for every build.
# It builds only while the repository is public, so the image can be public too.
name: Gateway image

on:
  push:
    branches: [main]
    paths: ['services/opencode-gateway/**', '.github/workflows/gateway-image.yml']
    tags: ['gateway-v*']

concurrency:
  group: gateway-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/maviechat-gateway
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=match,pattern=gateway-v(.*),group=1
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: services/opencode-gateway
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

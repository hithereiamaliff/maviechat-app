name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pinned Open WebUI reference (spec only, never executed)
        run: npm run ref:sync
      - run: npm run check
      - name: iOS JavaScript bundle
        run: npm run bundle
      - name: Android JavaScript bundle
        run: npm run bundle:android
